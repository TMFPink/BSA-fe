<ion-router-outlet></ion-router-outlet>

<div
  *ngIf="!hideNavBar"
  class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[90%] flex items-center justify-between p-5 bg-[var(--secondary-theme)] mb-2 rounded-full"
>
  <div
    (click)="onNavigate('/home')"
    [ngClass]="
      isRouteActive('/home')
        ? 'text-[var(--main-theme)] text-3xl '
        : 'text-3xl text-white'
    "
  >
    <nz-icon nzType="home" nzTheme="outline" />
  </div>
  <div
    (click)="onNavigate('/bills')"
    [ngClass]="
      isRouteActive('/bills')
        ? 'text-[var(--main-theme)] text-3xl '
        : 'text-3xl text-white'
    "
  >
    <ion-icon
      name="receipt-outline"
      class="text-4xl content-center flex items-center"
    ></ion-icon>
  </div>

  <div
    class="absolute -top-6 left-1/2 -translate-x-1/2 w-20 h-20 flex items-center justify-center text-white text-3xl bg-[var(--background-color)] rounded-full shadow-lg border-4 border-[var(--secondary-theme)]"
    (click)="onNavigate('/bills/create-bill')"
  >
    <nz-icon nzType="plus" nzTheme="outline" />
  </div>
  <div></div>
  <div
    (click)="onNavigate('/friends')"
    [ngClass]="
      isRouteActive('/friends')
        ? 'text-3xl text-[var(--main-theme)]'
        : 'text-3xl text-white'
    "
  >
    <nz-icon nzType="team" nzTheme="outline" />
  </div>

  <div
    (click)="onNavigate('/account')"
    [ngClass]="
      isRouteActive('/account')
        ? 'text-3xl text-[var(--main-theme)]'
        : 'text-3xl text-white'
    "
  >
    <nz-icon nzType="user" nzTheme="outline" />
  </div>
</div>
