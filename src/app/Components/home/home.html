<ion-content>
  <div class="mx-5 mt-10 mb-36">
    <div class="text-black text-2xl mt-5 font-bold">Total spent</div>

    <div class="mt-5 h-[300px] w-full">
      <div
        echarts
        #barChart
        [options]="chartOptionBar"
        class="w-full h-full"
      ></div>
    </div>

    <div class="text-black text-2xl font-bold">Summary</div>
    <div class="flex flex-row gap-5 mt-5 w-full">
      <div
        class="flex flex-col justify-between bg-[var(--secondary-theme)] py-6 px-3 rounded-2xl w-full h-36 shadow-lg"
      >
        <div class="font-bold text-xl text-[var(--main-theme)]">Owed You</div>
        <div class="text-xl flex justify-end font-bold text-white">
          {{ formatMoney(totalOwedToMe) }} VND
        </div>
      </div>
      <div
        class="flex flex-col justify-between bg-[var(--secondary-theme)] py-6 px-3 rounded-2xl w-full h-36 shadow-lg"
      >
        <div class="font-bold text-xl text-red-400">You Owed</div>
        <div class="text-xl flex justify-end font-bold text-white">
          {{ formatMoney(totalIOwe) }} VND
        </div>
      </div>
    </div>

    <div class="flex gap-4 my-5">
      <div
        (click)="selectFilter('all')"
        [ngClass]="{
          'bg-[var(--secondary-theme)] text-white': selectedFilter === 'all',
          'bg-gray-100 text-gray-600': selectedFilter !== 'all'
        }"
        class="px-6 py-3 rounded-full cursor-pointer transition-all font-semibold"
      >
        All
      </div>
      <div
        (click)="selectFilter('owed')"
        [ngClass]="{
          'bg-[var(--main-theme)] text-white': selectedFilter === 'owed',
          'bg-gray-100 text-gray-600': selectedFilter !== 'owed'
        }"
        class="px-6 py-3 rounded-full cursor-pointer transition-all font-semibold"
      >
        Owed You
      </div>
      <div
        (click)="selectFilter('you-owed')"
        [ngClass]="{
          'bg-red-400 text-white': selectedFilter === 'you-owed',
          'bg-gray-100 text-gray-600': selectedFilter !== 'you-owed'
        }"
        class="px-6 py-3 rounded-full cursor-pointer transition-all font-semibold"
      >
        You Owed
      </div>
    </div>

    <div class="flex flex-col gap-y-5 mt-5">
      <div
        *ngFor="let user of listUser"
        class="bill-border border w-full flex flex-row justify-between rounded-2xl px-2 py-2"
        [ngClass]="{'cursor-pointer': !user.owed}"
        (click)="!user.owed && showPaymentPopup(user)"
      >
        <div class="flex flex-row gap-5 items-center">
          <div class="rounded-full border bill-border p-2">
            <img [src]="imageUrl(user.avt)" alt="avatar" class="w-10 h-10" />
          </div>
          <div class="text-black text-lg">{{user.name}}</div>
        </div>
        <div
          class="text-lg font-bold flex items-center gap-2"
          [ngClass]="{'text-[var(--main-theme)]': user.owed, 'text-red-400': !user.owed}"
        >
          <div>{{user.owed ? '+' : '-'}}</div>
          <div>{{formatMoney(user.amount)}} VND</div>
        </div>
      </div>
    </div>
    <!-- Pie chart for spending by category -->
    <div class="text-black text-2xl mt-5 font-bold">Spending by Category</div>
    <div class="mt-5 h-[300px] w-full">
      <div
        echarts
        #pieChart
        [options]="chartOptionPie"
        class="w-full h-full"
      ></div>
    </div>
  </div>
</ion-content>
