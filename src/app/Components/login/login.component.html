<div class="w-full max-w-md bg-white p-8 shadow-lg relative h-full">
  <!-- Circles Design -->
  <div
    class="absolute top-0 left-0 w-52 h-52 bg-[var(--main-theme)] rounded-full -translate-x-10 -translate-y-10"
  ></div>
  <div
    class="absolute bottom-0 right-0 w-32 h-32 bg-[var(--secondary-theme)] rounded-full translate-x-10 translate-y-10"
  ></div>

  <div class="flex flex-col items-center mt-[156px]">
    <div class="text-3xl font-bold mt-4">Welcome!</div>
  </div>

  <div class="my-6 flex justify-center">
    <img src="assets/icon/split_bill_icon.webp" alt="logo" class="w-32 h-32" />
  </div>

  <!-- Login Screen -->
  <form nz-form [formGroup]="loginForm">
    <nz-form-item>
      <nz-form-control>
        <input
          type="text"
          placeholder="Username"
          formControlName="username"
          class="w-full p-2 text-lg bg-white rounded-lg text-gray-800 border-2 border-black"
        />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-control>
        <input
          type="password"
          placeholder="••••••••"
          formControlName="password"
          class="mt-3 w-full p-2 text-lg bg-white rounded-lg text-gray-800 border-2 border-black"
        />
      </nz-form-control>
    </nz-form-item>

    <button
      class="mt-6 w-full bg-[var(--main-theme)] text-white font-bold p-3 rounded-lg text-xl"
      (click)="onLogin()"
    >
      Sign In
    </button>
    <div class="flex justify-between px-4">
      <div
        routerLink="/auth/register"
        class="text-black mt-3 block text-center text-md"
      >
        Don't have account? Register
      </div>
      <a href="#" class="text-black mt-3 block text-center text-md"
        >Forgot Password?</a
      >
    </div>
  </form>
</div>
