<ion-content>
  <div class="mx-5 mt-10 mb-32">
    <div class="flex justify-between items-center">
      <div class="text-black text-2xl my-5 font-bold mt-5">Bill List</div>
      <ion-button
        class="text-white text-lg font-bold bg-[var(--secondary-theme)] rounded-3xl border border-[var(--secondary-theme)] capitalize"
        fill="clear"
        (click)="openFilter()"
        size="small"
      >
        filter
      </ion-button>
    </div>

    @for (bill of billList; track $index) {
    <div (click)="toBillDetail(bill.id)" class="cursor-pointer">
      <bill-card-ui [bill]="bill"></bill-card-ui>
    </div>

    }
  </div>
</ion-content>
