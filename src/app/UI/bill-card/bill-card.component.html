<div class="shadow-xl mt-5 max-w-sm w-[400px] h-auto">
  <div
    class="border border-t rounded-t-2xl text-lg font-bold py-5 px-5 flex flex-row justify-between items-center"
    [ngStyle]="{ 'background-color': getBillCategoryBG(bill.billCategory) }"
  >
    <div class="text-md uppercase whitespace-nowrap">
      {{ bill.billCategory }}
    </div>
    <div class="">
      {{ bill.billDate }}
    </div>
  </div>
  <div class="px-5 flex flex-col bg-white rounded-b-2xl">
    <div class="flex flex-col justify-between items-center mt-5">
      <div
        class="text-black w-full font-bold text-2xl flex justify-center border-b pb-5 border-[var(--secondary-theme)]"
      >
        {{ bill.billName }}
      </div>
      <div
        class="flex flex-wrap w-full gap-2 border-b py-5 border-[var(--secondary-theme)]"
      >
        @for (user of bill.users; track $index) {
        <div
          class="rounded-full object-cover border border-[var(--secondary-theme)] p-1"
        >
          <img [src]="user.avt" class="w-10 h-10" alt="avatar" />
        </div>
        }
      </div>
    </div>
    @for (billDetail of bill.billDetail; track $index) {
    <div class="flex flex-row justify-between items-center my-5">
      <div class="text-gray-600">{{ billDetail.name }}</div>
      <div class="whitespace-nowrap text-black font-bold">
        {{ billDetail.amount }}
      </div>
    </div>
    }
    <div
      class="flex flex-row justify-between items-center mb-5 border-t pt-5 border-[var(--secondary-theme)] text-lg"
    >
      <div class="text-black font-bold">TOTAL</div>
      <div class="whitespace-nowrap text-black font-bold">
        {{ bill.billAmount }}
      </div>
    </div>
  </div>
</div>
