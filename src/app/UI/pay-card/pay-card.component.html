<div class="pay-card">
  <h2 class="text-[var(--main-theme)] text-3xl font-bold mb-4">
    Pay for {{ user?.name }}
  </h2>
  <p class="text-gray-700 text-xl font-medium mb-6">
    Amount:
    <span class="text-[var(--secondary-theme)] text-2xl font-semibold">
      {{ formatCurrency(user?.amount) }} VND
    </span>
  </p>
  <div
    class="w-full h-80 flex items-center justify-center border border-gray-300 rounded-lg bg-gray-100"
    *ngIf="user.qrCode"
  >
    <img
      [src]="user.qrCode"
      (error)="user.qrCode = null"
      id="qrCodeImage"
      alt="QR Code"
      class="max-w-full max-h-full"
    />
  </div>
  <div
    class="w-full h-40 flex items-center justify-center border border-gray-300 rounded-lg bg-gray-100"
    *ngIf="!user.qrCode"
  >
    <p *ngIf="!user.qrCode" class="text-gray-500">No QR code</p>
  </div>
  <div
    *ngIf="user.qrCode"
    (click)="downloadQRCode()"
    class="w-full mt-4 px-4 py-2 bg-[var(--secondary-theme)] text-white rounded-lg text-2xl"
  >
    <span nz-icon nzType="download" nzTheme="outline"></span>
    Download QR Code
  </div>

  <div
    class="slider-container mt-10"
    *ngIf="!(isProcessing$ | async)"
    (mousedown)="startSlide($event)"
    (touchstart)="startSlide($event)"
  >
    <div class="slider-track"></div>
    <div
      class="slider-thumb"
      #sliderThumb
      (mousedown)="startSlide($event)"
      (touchstart)="startSlide($event)"
    >
      Slide to Pay
    </div>
  </div>

  <div class="processing-container" *ngIf="isProcessing$ | async">
    <div class="spinner"></div>
    <p>Processing Payment...</p>
  </div>
</div>
